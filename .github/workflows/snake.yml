name: Generate Contribution Snake

on:
schedule:
- cron: "0 0 * * *"
workflow_dispatch:

permissions:
contents: write

jobs:
generate-snake:
runs-on: ubuntu-latest

```
steps:
  - name: Generate Snake
    uses: Platane/snk@v3
    with:
      github_user_name: WandrysFG
      outputs: |
        dist/github-snake.svg?color_snake=#FF0000&color_dots=#220000,#660000,#990000,#CC0000,#FF3333
        dist/github-snake-dark.svg?color_snake=#FF3333&color_dots=#220000,#660000,#990000,#CC0000,#FF3333

  - name: Deploy Snake
    uses: crazy-max/ghaction-github-pages@v4
    with:
      build_dir: dist
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
