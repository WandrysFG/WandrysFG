name: Generate Contribution Snake

on:
schedule:
- cron: "0 3 * * *"
workflow_dispatch:
push:
branches:
- main

jobs:
generate:
permissions:
contents: write

```
runs-on: ubuntu-latest

timeout-minutes: 5

steps:
  - name: Generate Snake
    uses: Platane/snk/svg-only@v3
    with:
      github_user_name: WandrysFG
      outputs: |
        dist/github-snake.svg?color_snake=#FF0000&color_dots=#220000,#660000,#990000,#CC0000,#FF3333
        dist/github-snake-dark.svg?color_snake=#FF3333&color_dots=#220000,#660000,#990000,#CC0000,#FF3333

  - name: Publish Snake
    uses: crazy-max/ghaction-github-pages@v3.1.0
    with:
      target_branch: output
      build_dir: dist
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
