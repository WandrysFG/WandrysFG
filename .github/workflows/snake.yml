name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: WandrysFG
          outputs: |
            dist/github-snake.svg?color_snake=#FF0000&color_dots=#220000,#660000,#990000,#CC0000,#FF3333
            dist/github-snake-dark.svg?color_snake=#FF3333&color_dots=#220000,#660000,#990000,#CC0000,#FF3333

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
