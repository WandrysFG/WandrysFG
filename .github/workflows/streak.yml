```yaml
name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *"

  push:
    branches:
      - main
    paths:
      - ".github/workflows/stats.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create profile directory
        run: mkdir -p profile

      - name: Generate GitHub Stats
        uses: cicirello/user-statistician@v1
        with:
          image-file: profile/stats.svg
          colors: "#050505 #FF0000 #8B0000 #FF3333 #FFFFFF"
          hide-keys: languages
          include-title: true
          custom-title: "GitHub Stats"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages
        uses: cicirello/user-statistician@v1
        with:
          image-file: profile/langs.svg
          colors: "#050505 #8B0000 #FF0000 #FF3333 #FFFFFF"
          hide-keys: general,contributions,repositories
          include-title: true
          custom-title: "Top Languages"
          max-languages: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/langs.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update GitHub statistics"
            git push
          fi
```
