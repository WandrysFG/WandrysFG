name: user-statistician

on:
  schedule:
    - cron: '0 3 * * *'   # se regenera todos los días a las 3am UTC
  push:
    branches: [ main ]
    paths: [ '.github/workflows/stats.yml' ]
  workflow_dispatch: {}   # correrlo manualmente desde la pestaña "Actions"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub stats card (neon)
        uses: cicirello/user-statistician@v1
        with:
          image-file: images/stats.svg
          colors: '#060606 #FF00FF #00FFF2 #FF00FF #e5e5e5'
          hide-keys: languages
          include-title: true
          custom-title: 'GitHub Stats'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card (neon)
        uses: cicirello/user-statistician@v1
        with:
          image-file: images/langs.svg
          colors: '#060606 #39FF14 #00FFF2 #39FF14 #e5e5e5'
          hide-keys: general, contributions, repositories
          include-title: true
          custom-title: 'Top Languages'
          max-languages: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
