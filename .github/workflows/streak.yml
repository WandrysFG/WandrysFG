```yaml
name: Generate GitHub Profile Stats

on:
  schedule:
    - cron: "0 3 * * *"

  push:
    branches:
      - main
    paths:
      - ".github/workflows/stats.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create profile directory
        run: mkdir -p profile

      # ==========================================
      # GitHub Stats
      # ==========================================
      - name: Generate GitHub Stats
        uses: cicirello/user-statistician@v1
        with:
          image-file: profile/stats.svg

          # Neon Red theme
          colors: "#050505 #FF0000 #8B0000 #FF3333 #FFFFFF"

          hide-keys: languages
          include-title: true
          custom-title: "GitHub Stats"

          # Keep the generated SVG in the repository
          commit-and-push: true
          commit-message: "Update GitHub stats"

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # Top Languages
      # ==========================================
      - name: Generate Top Languages
        uses: cicirello/user-statistician@v1
        with:
          image-file: profile/langs.svg

          # Neon Red theme
          colors: "#050505 #8B0000 #FF0000 #FF3333 #FFFFFF"

          hide-keys: general, contributions, repositories
          include-title: true
          custom-title: "Top Languages"
          max-languages: 8

          # Keep the generated SVG in the repository
          commit-and-push: true
          commit-message: "Update top languages"

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # GitHub Streak
      # ==========================================
      - name: Generate GitHub Streak
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          path: profile/streak.svg

          options: >-
            user=${{ github.repository_owner }}
            &theme=default
            &hide_border=true
            &background=050505
            &ring=FF0000
            &fire=FF3333
            &currStreakLabel=FF0000
            &sideLabels=FF0000
            &currStreakNum=FFFFFF
            &sideNums=FFFFFF
            &dates=888888
            &stroke=8B0000
            &disable_animations=true

          token: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # Commit Streak
      # ==========================================
      - name: Commit GitHub Streak
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/streak.svg

          if git diff --cached --quiet; then
            echo "No streak changes to commit."
          else
            git commit -m "Update GitHub streak"
            git push
          fi
```
